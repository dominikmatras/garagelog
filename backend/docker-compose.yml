services:
  postgres:
    image: postgres:17-alpine
    container_name: garagelog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: garagelog
      POSTGRES_USER: garagelog
      POSTGRES_PASSWORD: garagelog
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U garagelog -d garagelog']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
